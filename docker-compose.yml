# NodeGoat + MongoDB. Las credenciales llegan por variables de entorno (archivo .env, que NO se versiona).
services:
  mongo:
    image: mongo:4.4.29          # NodeGoat usa un driver antiguo de MongoDB; 4.4 es compatible
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?defina MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
    expose:
      - "27017"                  # solo visible dentro de la red de Compose; no se publica al host
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/nodegoat?authSource=admin
      COOKIE_SECRET: ${COOKIE_SECRET:?defina COOKIE_SECRET en .env}
      CRYPTO_KEY: ${CRYPTO_KEY:?defina CRYPTO_KEY en .env}
    ports:
      - "127.0.0.1:4000:4000"    # solo accesible desde la propia máquina
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

volumes:
  mongo-data:
